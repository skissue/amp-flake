name: Update sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  update:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update, build, and push Desktop sources
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SYSTEM: ${{ matrix.system }}
        run: |
          python3 .github/scripts/update-sources.py desktop "$SYSTEM"
          if git diff --quiet -- sources.json; then
            exit 0
          fi

          nix build ".#packages.$SYSTEM.amp-desktop" --no-link --print-build-logs

          version=$(jq -r --arg system "$SYSTEM" '.sources.desktop.platforms[$system].version' sources.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sources.json
          git commit -m "bump(desktop/$SYSTEM): v$version"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Update, build, and push CLI sources
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SYSTEM: ${{ matrix.system }}
        run: |
          python3 .github/scripts/update-sources.py cli "$SYSTEM"
          if git diff --quiet -- sources.json; then
            exit 0
          fi

          nix build ".#packages.$SYSTEM.amp-cli" ".#packages.$SYSTEM.amp-desktop" --no-link --print-build-logs

          version=$(jq -r --arg system "$SYSTEM" '.sources.cli.platforms[$system].version' sources.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sources.json
          git commit -m "bump(cli/$SYSTEM): v$version"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Update, build, and push nixpkgs
        if: matrix.system == 'x86_64-linux'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SYSTEM: ${{ matrix.system }}
        run: |
          nix flake update nixpkgs
          if git diff --quiet -- flake.lock; then
            exit 0
          fi

          nix build ".#packages.$SYSTEM.amp-desktop" --no-link --print-build-logs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- flake.lock
          git commit -m "bump: update nixpkgs"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
